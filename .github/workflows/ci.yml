name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pairpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pairpilot?schema=public
      AUTH_SESSION_SECRET: ci-insecure-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build showcase artifact
        run: npm run showcase:build

      - name: Production build
        run: npm run build

      - name: Apply migrations (E2E)
        run: npx prisma migrate deploy

      - name: Seed database (E2E)
        run: npm run db:seed

      - name: End-to-end workflow verification (real Postgres)
        run: npm run verify:workflow

      - name: Durable queue verification (pg-boss, real Postgres)
        run: npm run verify:queue
