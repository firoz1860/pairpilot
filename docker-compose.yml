# Reproducible local/staging stack: Postgres + migrations + web app + worker.
# Copy .env.example to .env first. No secrets are embedded here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pairpilot
      POSTGRES_PASSWORD: pairpilot
      POSTGRES_DB: pairpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://pairpilot:pairpilot@db:5432/pairpilot?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pairpilot:pairpilot@db:5432/pairpilot?schema=public
      APP_BASE_URL: http://localhost:3000
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-dev-insecure-change-me-to-a-long-random-string}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      SOURCE_PROVIDER: ${SOURCE_PROVIDER:-fixture}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "npx tsx src/workers/index.ts"
    environment:
      DATABASE_URL: postgresql://pairpilot:pairpilot@db:5432/pairpilot?schema=public
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-dev-insecure-change-me-to-a-long-random-string}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      SOURCE_PROVIDER: ${SOURCE_PROVIDER:-fixture}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
